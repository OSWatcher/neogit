[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "neogit"
version = "0.1.0"
description = "Git-like tool backed by Neo4j"
authors = ["Mathieu Tarral <mathieu.tarral@protonmail.com>"]
readme = 'README.md'
license = 'Proprietary'
classifiers = [
    "Programming Language :: Python :: 3",
]

[tool.poetry.dependencies]
python = "^3.7"
neo4j = "4.2.1"
py2neo = "2021.2.0"
docopt = "0.6.2"
dynaconf = "3.1.4"
PyYAML = "5.4.1"
coloredlogs = "15.0"
more-itertools = "8.7.0"
apache-libcloud = "3.3.1"
fasteners = "0.16"
appdirs = "1.4.4"
rich = "10.2.0"
attrs = "^21.2.0"
neomodel = "^4.0.5"
types-PyYAML = "^6.0.0"

[tool.poetry.dev-dependencies]
black = "21.8b0"
flake8 = "3.9.2"
isort = "5.9.3"
mypy = "0.910"
vermin = "1.2.2"
pytest = "6.2.5"
coverage = "5.5"
# TODO: darglint, flake8-docstrings
types-docopt = "^0.6.3"
appdirs-stubs = "^0.1.0"
GitPython = "^3.1.14"
pyfakefs = "^4.5.2"

[tool.black]
line-length = 120
extend-exclude = "^/tests/data/.*"

[tool.isort]
# black compatible config
# https://black.readthedocs.io/en/stable/compatible_configs.html
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
skip_glob = "tests/data/*"

[tool.coverage.run]
# measure branch coverage in addition to statement coverage
branch = true
# restrict coverage on neogit package only
source = ["neogit"]

[tool.mypy]
warn_unreachable = true
# TODO: warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "neo4j.*",
    "py2neo.*",
    "neomodel.*",
    "dynaconf.*",
    "coloredlogs.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# ignore dev tests by default
addopts = "--strict-markers -m 'not dev'"
markers = 'dev: mark a test as only for development with IPDB purposes'
