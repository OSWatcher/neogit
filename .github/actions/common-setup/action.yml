name: 'Project setup'
description: 'This actions setup python, poetry, and installs the dependencies'
author: 'Wenzel'
runs:
    using: 'composite'
    steps:
      - name: Set up Python 🐍
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install Poetry
        uses: Gr1N/setup-poetry@v7

      - name: Setup cache
        uses: actions/cache@v2
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Setup project
        run: poetry install
        shell: bash
