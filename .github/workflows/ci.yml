name: CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

jobs:
  dev:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        make_target: [fmt, lint, type, vermin]
        include:
          # black needs --check to return an error code
          - make_target: fmt
            extra_args: --check
    steps:
      - uses: actions/checkout@v4

      - name: Project setup
        uses: ./.github/actions/common-setup

      - name: run make target
        run: poetry run poe ${{ matrix.make_target }} ${{ matrix.extra_args }}

  unit_test:
    strategy:
      fail-fast: false
      matrix:
        # TODO: add windows-latest and ditch Makefile
        os: [ubuntu-latest]
        python_version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Project setup
        uses: ./.github/actions/common-setup
        with:
          python_version: "${{ matrix.python_version }}"

      - name: Check format
        run: poetry run poe unit_test

  integration_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Project setup
        uses: ./.github/actions/common-setup
        with:
          python_version: ${{ matrix.python }}

      # Run integration tests using built-in test infrastructure
      - name: Run integration tests
        timeout-minutes: 10
        run: |
          source $(poetry env info --path)/bin/activate
          coverage run -m pytest -v tests/integration
          coverage report

  build_image:
    # build Docker image, but don't push it
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          push: false
          build-args: |
            python_version=${{ matrix.python_version}}
          tags: wenzel/neogit:latest

  release:
    # publish to PyPI first; only create the GitHub release if that succeeds
    needs: [publish_pypi]
    # only on push of a tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"

      - name: Create a Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          body_path: ${{ github.workspace }}/.github/RELEASE.md

  publish_pypi:
    needs: [dev, unit_test, integration_test, build_image]
    # only on push of a tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Project setup
        uses: ./.github/actions/common-setup

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(poetry version --short)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match pyproject version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Build and publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: poetry publish --build --no-interaction --skip-existing
