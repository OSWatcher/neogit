version: 1
disable_existing_loggers: false
formatters:
  simple:
    format: "%(asctime)s %(levelname)s:%(name)s:%(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: NOTSET
    formatter: simple
    stream: ext://sys.stderr
root:
  level: INFO
  handlers: [console]
loggers:
  # silence noisy third party libs
  neo4j:
    level: WARNING
  urllib3.connectionpool:
    level: WARNING
  # silence pipeline since it's noisy
  neogit.merkle.pipeline.MerklePipeline:
    level: WARNING
